# Security scans on every push and pull request.
# Pin third-party actions to a full commit SHA in production (an action tag can be moved by an attacker);
# tags are used here so the lab stays readable. Check each action's releases page for the newest tag.
name: devsecops-pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write # upload SARIF to the Security > Code scanning tab

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Full scan (report everything)
        run: semgrep scan --config p/python --config p/flask --config p/secrets --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarif-semgrep
          path: semgrep.sarif
      - name: Gate (fail on ERROR severity only)
        run: semgrep scan --config p/python --config p/flask --severity ERROR --error

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: SCA + SBOM (Trivy filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
      - name: Dependency scan (gate on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-sca.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-sca.sarif
          category: trivy-sca
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarif-trivy-sca
          path: trivy-sca.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.cdx.json

  container:
    name: Container scan (Trivy image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lab-app:${{ github.sha }} .
      - name: Image scan (gate on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lab-app:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarif-trivy-image
          path: trivy-image.sarif

  iac:
    name: IaC (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov
      - name: Scan Terraform (writes results_sarif.sarif)
        run: checkov -d terraform --framework terraform -o cli -o sarif --output-file-path console,.
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results_sarif.sarif
          category: checkov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarif-checkov
          path: results_sarif.sarif

  dast:
    name: DAST (OWASP ZAP baseline, report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lab-app .
      - name: Start the app
        run: |
          docker run -d -p 5000:5000 --name app lab-app
          sleep 5
          curl -sf http://localhost:5000/ > /dev/null
      - uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:5000
          allow_issue_writing: false
          fail_action: false

  metrics:
    name: Findings summary
    runs-on: ubuntu-latest
    needs: [sast, sca, container, iac]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true
      - run: python3 metrics/sarif_summary.py sarif/*.sarif >> "$GITHUB_STEP_SUMMARY"
